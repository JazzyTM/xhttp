# ============================================================
# :80 — ACME challenge + redirect → HTTPS :443
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name video-quality.animanga.su _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/video-quality.animanga.su;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# upstream XRAY CDN BRIDGE (ТОЛЬКО 5448)
#    + backup backend, который отдаёт {"status":"ok"}
#      если Xray вдруг не отвечает → HTTP 200 OK, а не 502/503
# ============================================================
upstream xray_cdn_bridge {
    server 127.0.0.1:5448 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:20080 backup;  # локальный dummy OK-сервер
}

# ============================================================
# :443 HTTPS — ВСЁ ЗДЕСЬ (сайт + оба пути XHTTP → 5448)
# ============================================================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name video-quality.animanga.su _;

    ssl_certificate     /etc/letsencrypt/live/video-quality.animanga.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video-quality.animanga.su/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/video-quality.animanga.su;
    index index.html index.htm;

    access_log /var/log/nginx/animanga-access.log;
    error_log  /var/log/nginx/animanga-error.log;

    set $origin_secret "c6da03b9dbfd03c72813edb7d4791f3180a1da03f372c358";

    # ==========================================================
    # XHTTP Bridge A — /stream/v2/chapters/segments
    #   → 5448, если секркт подошёл. Если Xray отдал 4xx/5xx или упал → dummy OK JSON 200
    # ==========================================================
    location /stream/v2/chapters/segments {
        if ($http_x_origin_secret != $origin_secret) {
            return 403;
        }
        proxy_pass http://xray_cdn_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        client_max_body_size 0;
        chunked_transfer_encoding on;
    }

    # ==========================================================
    # XHTTP Bridge B — /cdn/v3/media/hls/fragments
    #   → 5448, если секркт подошёл. Если Xray упал → dummy OK JSON 200
    # ==========================================================
    location /cdn/v3/media/hls/fragments {
        if ($http_x_origin_secret != $origin_secret) {
            return 403;
        }
        proxy_pass http://xray_cdn_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        client_max_body_size 0;
        chunked_transfer_encoding on;
    }

    # ==========================================================
    # САЙТ-ЗАГЛУШКА (статика + SPA fallback)
    # ==========================================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================
# :20080 localhost DUMMY OK SERVER
#   если Xray (5448) отвалился — nginx fallback сюда
#   отдаёт HTTP 200 + JSON {"status":"ok", ...} — не 502/503!
# ============================================================
server {
    listen 127.0.0.1:20080;
    server_name _;

    access_log off;
    error_log off;

    default_type application/json;
    add_header X-Service "animanga-cdn-bridge";
    return 200 '{"status":"ok","service":"animanga-cdn-bridge","server":"video-quality.animanga.su"}';
}
